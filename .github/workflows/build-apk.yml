name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug and Release APKs
        working-directory: ./omniai-studio
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-and-release-apks
          path: |
            omniai-studio/app/build/outputs/apk/debug/*.apk
            omniai-studio/app/build/outputs/apk/release/*.apk
