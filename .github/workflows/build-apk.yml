name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH"
            cd "$(dirname "$GRADLEW_PATH")"
            ./gradlew assembleDebug
          else
            echo "gradlew not found, locating build.gradle..."
            BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              cd "$(dirname "$BUILD_FILE")"
            fi
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
