name: Keep Supabase Cloud DB Alive

on:
  schedule:
    # Runs every 4 days at 06:00 UTC to prevent Supabase free-tier 7-day inactivity pause
    - cron: '0 6 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Lightweight PostgREST Health Ping
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase user_profiles Count Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured yet. Add both under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          BASE_URL="${SUPABASE_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/supabase_ping.out -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${BASE_URL}/rest/v1/user_profiles?select=count")

          echo "Supabase keep-alive ping returned HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "Unexpected HTTP status from Supabase keep-alive ping: ${HTTP_CODE}"
            exit 1
          fi
          echo "Supabase project activity recorded successfully."
